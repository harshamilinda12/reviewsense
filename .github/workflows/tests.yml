
name: ReviewSense CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ------------------------------------------
  # Job 1: Python automated tests
  # ------------------------------------------

  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run automated tests
        run: python -m pytest -v


  # ------------------------------------------
  # Job 2: Docker integration tests
  # ------------------------------------------

  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build and start containers
        run: |
          docker compose up --build -d --wait --wait-timeout 180

      - name: Check API health
        run: |
          curl --fail --silent --show-error \
            http://localhost:8000/health

      - name: Check Streamlit frontend
        run: |
          curl --fail --silent --show-error \
            --retry 15 \
            --retry-all-errors \
            --retry-delay 2 \
            --output /dev/null \
            http://localhost:8501/

      - name: Test a real sentiment prediction
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "http://localhost:8000/predict"

          payload = {
              "review": (
                  "This movie was fantastic with wonderful "
                  "acting and a brilliant story."
              )
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(
              request, timeout=20
          ) as response:
              assert response.status == 200
              result = json.load(response)

          assert result["sentiment"] in (
              "positive", "negative"
          )

          scores = result["probabilities"]

          assert set(scores) == {
              "positive", "negative"
          }

          assert abs(sum(scores.values()) - 1) < 0.01

          print("API prediction successful!")
          print(result)
          PY

      - name: Test communication between containers
        run: |
          docker compose exec -T web python -c "
          import os
          import requests

          url = os.environ['API_URL']

          response = requests.post(
              url,
              json={
                  'review': 'An excellent and enjoyable movie.'
              },
              timeout=20
          )

          response.raise_for_status()

          print('Container networking successful!')
          print(response.json())
          "

      - name: Show logs if something fails
        if: failure()
        run: docker compose logs --no-color || true

      - name: Stop and remove test containers
        if: always()
        run: docker compose down --remove-orphans
