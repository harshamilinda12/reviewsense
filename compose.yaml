
services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    ports:
      - "8501:8501"

    environment:
      API_URL: http://api:8000/predict

    depends_on:
      api:
        condition: service_healthy
